<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { margin-top: 0; text-align: center; color: var(--primary); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
        input, select {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1;
            border-radius: 6px; box-sizing: border-box; font-size: 14px;
        }
        input:focus, select:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }
        #campo-parcelas { display: none; }
        button {
            width: 100%; padding: 12px; background-color: var(--primary);
            color: white; border: none; border-radius: 6px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            transition: background-color 0.2s; margin-top: 10px;
        }
        button:hover { background-color: #1d4ed8; }
        #status { margin-top: 15px; text-align: center; font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <h2>Lançar Novo Gasto</h2>
    <form id="gastoForm">
        <div class="form-group">
            <label for="descricao">Descrição (ex: Conta de Luz, Mercado)</label>
            <input type="text" id="descricao" required>
        </div>

        <div class="form-group">
            <label for="valor">Valor Total (R$)</label>
            <input type="number" step="0.01" id="valor" placeholder="0.00" required>
        </div>

        <div class="form-group">
            <label for="tipo">Tipo de Gasto</label>
            <select id="tipo" required>
                <option value="Fixo">Fixo (ex: Aluguel, Internet)</option>
                <option value="Variável">Variável (ex: Lazer, Restaurante)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="formaPagamento">Forma de Pagamento</label>
            <select id="formaPagamento" onchange="verificarParcelas()" required>
                <option value="À vista">À vista</option>
                <option value="Parcelado">Parcelado</option>
            </select>
        </div>

        <div class="form-group" id="campo-parcelas">
            <label for="parcelas">Número de Parcelas</label>
            <input type="number" id="parcelas" min="2" value="2">
        </div>

        <button type="submit" id="btnSubmit">Registrar Gasto</button>
        <div id="status"></div>
    </form>
</div>

<script>
    // Substitua o link abaixo pela URL que o Google Apps Script gerou
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1cKThLLx3EF3wERPK6i4USCyXDHfrwKboGZnUcn0QGRzZg3AnfUTnZwSz9bhFCbBQ/exec';

    function verificarParcelas() {
        const forma = document.getElementById('formaPagamento').value;
        const campoParcelas = document.getElementById('campo-parcelas');
        if (forma === 'Parcelado') {
            campoParcelas.style.display = 'block';
            document.getElementById('parcelas').required = true;
        } else {
            campoParcelas.style.display = 'none';
            document.getElementById('parcelas').required = false;
        }
    }

    document.getElementById('gastoForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btnSubmit');
        const statusDiv = document.getElementById('status');
        btn.innerText = 'Enviando...';
        btn.disabled = true;
        statusDiv.innerText = '';
        statusDiv.style.color = 'black';

        const payload = {
            descricao: document.getElementById('descricao').value,
            valor: document.getElementById('valor').value,
            tipo: document.getElementById('tipo').value,
            formaPagamento: document.getElementById('formaPagamento').value,
            parcelas: document.getElementById('formaPagamento').value === 'Parcelado' ? document.getElementById('parcelas').value : 1
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === 'sucesso') {
                statusDiv.innerText = 'Gasto registrado com sucesso na planilha!';
                statusDiv.style.color = 'green';
                document.getElementById('gastoForm').reset();
                verificarParcelas(); // Reseta a exibição do campo de parcelas
            } else {
                throw new Error(data.mensagem);
            }
        })
        .catch(error => {
            console.error('Erro:', error);
            statusDiv.innerText = 'Erro ao registrar gasto. Verifique o console.';
            statusDiv.style.color = 'red';
        })
        .finally(() => {
            btn.innerText = 'Registrar Gasto';
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
