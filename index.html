<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; margin: 0; }
        .container { background-color: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        
        /* Abas */
        .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; color: #64748b; transition: 0.3s; }
        .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); margin-bottom: -2px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Formulário */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        #campo-parcelas { display: none; }
        button { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1d4ed8; }
        #status { margin-top: 15px; text-align: center; font-size: 14px; }

        /* Dashboard - Lista Expansível */
        .dashboard-header { text-align: center; margin-bottom: 20px; color: var(--primary); }
        .mes-container { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 15px; overflow: hidden; background: var(--card); }
        
        .mes-header { 
            background: var(--primary); color: white; padding: 15px 20px; 
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; 
            transition: background 0.3s; user-select: none;
        }
        .mes-header.collapsed { background: #f1f5f9; color: var(--text); }
        .mes-header:hover { opacity: 0.9; }
        
        .mes-title { font-size: 16px; font-weight: bold; }
        .mes-total { font-size: 18px; font-weight: bold; }
        
        .mes-body { display: block; padding: 0; }
        .mes-body.collapsed { display: none; }
        
        /* Divisória de Meses Anteriores */
        .divider { 
            text-align: center; margin: 30px 0 20px 0; color: #64748b; 
            font-size: 15px; border-bottom: 1px solid #cbd5e1; line-height: 0.1em; 
        }
        .divider span { background: var(--card); padding: 0 15px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 0; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background-color: #f8fafc; color: #475569; font-weight: 600; }
        .carregando { text-align: center; padding: 20px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <div class="tab active" onclick="mudarAba('lancamento')">Lançar Gasto</div>
        <div class="tab" onclick="mudarAba('dashboard'); carregarDados()">Dashboard</div>
    </div>

    <!-- Aba de Lançamento -->
    <div id="lancamento" class="tab-content active">
        <form id="gastoForm">
            <div class="form-group">
                <label>Data da Compra</label>
                <input type="date" id="dataCompra" required>
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <input type="text" id="descricao" placeholder="Ex: Mercado, TV, Celular" required>
            </div>
            <div class="form-group">
                <label>Valor Total (R$)</label>
                <input type="number" step="0.01" id="valor" required>
            </div>
            <div class="form-group">
                <label>Tipo</label>
                <select id="tipo" required>
                    <option value="Fixo">Fixo</option>
                    <option value="Variável">Variável</option>
                </select>
            </div>
            <div class="form-group">
                <label>Forma de Pagamento</label>
                <select id="formaPagamento" onchange="verificarParcelas()" required>
                    <option value="Débito / Pix / Dinheiro">Débito / Pix / Dinheiro (Mês Atual)</option>
                    <option value="Cartão de Crédito (1x)">Cartão de Crédito - 1x (Próxima Fatura)</option>
                    <option value="Cartão de Crédito (Parcelado)">Cartão de Crédito - Parcelado</option>
                </select>
            </div>
            <div class="form-group" id="campo-parcelas">
                <label>Número de Parcelas</label>
                <input type="number" id="parcelas" min="2" value="2">
            </div>
            <button type="submit" id="btnSubmit">Registrar Gasto</button>
            <div id="status"></div>
        </form>
    </div>

    <!-- Aba de Dashboard -->
    <div id="dashboard" class="tab-content">
        <h2 class="dashboard-header">Resumo Mensal</h2>
        <div id="listaMeses">
            <div class="carregando">Clique na aba para carregar...</div>
        </div>
    </div>
</div>

<script>
    // =========================================================
    // URLs já configuradas
    // =========================================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1cKThLLx3EF3wERPK6i4USCyXDHfrwKboGZnUcn0QGRzZg3AnfUTnZwSz9bhFCbBQ/exec'; 
    
    // O final da URL de leitura foi ajustado de pubhtml para pub?output=csv
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0gqmdVYvp5bbtA0xTj7rGVLvnzkfdUZ-bNCjIyX_zgCdjryXlqZ48nvG9wyoosU9Bn_wmS6SZiXCH/pub?gid=51915627&single=true&output=csv'; 
    // =========================================================

    document.getElementById('dataCompra').valueAsDate = new Date();
    let todosOsGastos = []; 

    function mudarAba(abaId) {
        document.querySelectorAll('.tab, .tab-content').forEach(el => el.classList.remove('active'));
        document.querySelector(`.tab[onclick*="${abaId}"]`).classList.add('active');
        document.getElementById(abaId).classList.add('active');
    }

    function verificarParcelas() {
        const forma = document.getElementById('formaPagamento').value;
        const isParcelado = forma === 'Cartão de Crédito (Parcelado)';
        document.getElementById('campo-parcelas').style.display = isParcelado ? 'block' : 'none';
        document.getElementById('parcelas').required = isParcelado;
    }

    // Lógica para SALVAR o gasto
    document.getElementById('gastoForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const status = document.getElementById('status');
        btn.innerText = 'Processando...'; btn.disabled = true; status.innerText = '';
        
        const payload = {
            dataCompra: document.getElementById('dataCompra').value,
            descricao: document.getElementById('descricao').value,
            valor: document.getElementById('valor').value,
            tipo: document.getElementById('tipo').value,
            formaPagamento: document.getElementById('formaPagamento').value,
            parcelas: document.getElementById('formaPagamento').value === 'Cartão de Crédito (Parcelado)' ? document.getElementById('parcelas').value : 1
        };

        fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(data => {
            if(data.status !== 'sucesso') throw new Error(data.mensagem);
            status.innerText = 'Gasto registrado com sucesso!';
            status.style.color = 'green';
            document.getElementById('gastoForm').reset();
            document.getElementById('dataCompra').valueAsDate = new Date();
            verificarParcelas();
        })
        .catch(err => {
            status.innerText = 'Erro ao salvar. Verifique o console.';
            status.style.color = 'red';
        })
        .finally(() => { btn.innerText = 'Registrar Gasto'; btn.disabled = false; });
    });

    // Função que expande/recolhe o mês ao clicar
    function toggleMes(elemento) {
        elemento.classList.toggle('collapsed');
        elemento.nextElementSibling.classList.toggle('collapsed');
    }

    function formatarNomeMes(mesAno) {
        if(!mesAno || !mesAno.includes('/')) return mesAno;
        const [m, a] = mesAno.split('/');
        const nomes = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        return `${nomes[parseInt(m) - 1]}/${a}`;
    }

    // Processa o arquivo CSV
    function processarCSV(csvTexto) {
        const linhas = csvTexto.split('\n');
        const resultado = [];
        
        for (let i = 1; i < linhas.length; i++) { 
            if (linhas[i].trim() === '') continue;
            const valores = linhas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if(valores.length >= 7) {
                resultado.push({
                    dataCompra: valores[0].replace(/['"]/g, '').trim(),
                    mesAnoPagamento: valores[1].replace(/['"]/g, '').trim(),
                    descricao: valores[2].replace(/['"]/g, '').trim(),
                    tipo: valores[3].replace(/['"]/g, '').trim(),
                    formaPagamento: valores[4].replace(/['"]/g, '').trim(),
                    parcela: valores[5].replace(/['"]/g, '').trim(),
                    valor: valores[6].replace(/['"]/g, '').trim()
                });
            }
        }
        return resultado;
    }

    function carregarDados() {
        const listaMeses = document.getElementById('listaMeses');
        listaMeses.innerHTML = '<div class="carregando">Lendo a planilha...</div>';
        
        const urlSemCache = CSV_URL + "&t=" + new Date().getTime();

        fetch(urlSemCache)
        .then(res => {
            if(!res.ok) throw new Error("Erro de rede");
            return res.text();
        })
        .then(csvTexto => {
            todosOsGastos = processarCSV(csvTexto);
            renderizarDashboard();
        }).catch(err => {
            listaMeses.innerHTML = '<div class="carregando" style="color:red">Erro ao baixar dados do Google Sheets.</div>';
        });
    }

    // Função que constrói o bloco de cada mês (HTML)
    function criarElementoMes(mesStr, isExpanded) {
        const gastosDoMes = todosOsGastos.filter(g => g.mesAnoPagamento === mesStr);
        let totalMes = 0;
        let linhasTabela = '';

        gastosDoMes.forEach(g => {
            const numOriginal = g.valor.toString().replace('R$', '').trim().replace('.', '').replace(',', '.');
            const valor = parseFloat(numOriginal) || 0;
            totalMes += valor;
            
            linhasTabela += `
                <tr>
                    <td>${g.dataCompra}</td>
                    <td>${g.descricao} <br><small style="color:#64748b">${g.formaPagamento} (Parc. ${g.parcela})</small></td>
                    <td>R$ ${valor.toFixed(2).replace('.', ',')}</td>
                </tr>
            `;
        });

        const collapsedClass = isExpanded ? '' : 'collapsed';
        const nomeMesFormatado = formatarNomeMes(mesStr);

        const mesDiv = document.createElement('div');
        mesDiv.className = 'mes-container';
        mesDiv.innerHTML = `
            <div class="mes-header ${collapsedClass}" onclick="toggleMes(this)">
                <span class="mes-title">${nomeMesFormatado}</span>
                <span class="mes-total">R$ ${totalMes.toFixed(2).replace('.', ',')}</span>
            </div>
            <div class="mes-body ${collapsedClass}">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Descrição / Parcela</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${linhasTabela}
                    </tbody>
                </table>
            </div>
        `;
        return mesDiv;
    }

    function renderizarDashboard() {
        const listaMeses = document.getElementById('listaMeses');
        listaMeses.innerHTML = ''; 

        if(todosOsGastos.length === 0) {
            listaMeses.innerHTML = '<div class="carregando">Nenhum gasto registrado ainda.</div>';
            return;
        }

        // Pega os meses únicos e calcula um "peso numérico" (Ano * 12 + Mês) para ordená-mos corretamente
        const mesesSet = new Set(todosOsGastos.map(g => g.mesAnoPagamento));
        const mesesMapeados = Array.from(mesesSet)
            .filter(m => m.includes('/'))
            .map(m => {
                const [mes, ano] = m.split('/');
                return { str: m, peso: parseInt(ano) * 12 + parseInt(mes) };
            });

        // Peso numérico do mês atual
        const hoje = new Date();
        const pesoAtual = hoje.getFullYear() * 12 + (hoje.getMonth() + 1);

        // Separa os meses: "Atuais e Futuros" vs "Passados"
        const mesesFuturos = mesesMapeados
            .filter(m => m.peso >= pesoAtual)
            .sort((a, b) => a.peso - b.peso); // Ordem Crescente (Set, Out, Nov...)

        const mesesPassados = mesesMapeados
            .filter(m => m.peso < pesoAtual)
            .sort((a, b) => b.peso - a.peso); // Ordem Decrescente (Agosto, Julho...)

        // Descobre qual mês deve vir expandido por padrão
        let mesParaExpandir = null;
        if (mesesFuturos.length > 0) {
            // Expande o mês atual, se não achar o mês atual, expande o mês futuro mais próximo
            const temMesAtual = mesesFuturos.some(m => m.peso === pesoAtual);
            mesParaExpandir = temMesAtual ? pesoAtual : mesesFuturos[0].peso;
        }

        // 1. Renderiza os Meses Atuais e Futuros
        mesesFuturos.forEach(m => {
            const isExpanded = (m.peso === mesParaExpandir);
            listaMeses.appendChild(criarElementoMes(m.str, isExpanded)); // Usando appendChild mantém a ordem!
        });

        // 2. Renderiza a Divisória de Meses Anteriores e insere os meses antigos
        if (mesesPassados.length > 0) {
            const divider = document.createElement('h3');
            divider.className = 'divider';
            divider.innerHTML = '<span>Meses Anteriores</span>';
            listaMeses.appendChild(divider);

            mesesPassados.forEach(m => {
                // Meses passados começam sempre retraídos (isExpanded = false)
                listaMeses.appendChild(criarElementoMes(m.str, false));
            });
        }
    }
</script>

</body>
</html>
