<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle de Gastos</title>
    
    <!-- Configurações para PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    
    <!-- Biblioteca de Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Cores do Modo Claro (Padrão) */
        :root { 
            --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; 
            --text: #1e293b; --border: #e2e8f0; --fixo: #2563eb; 
            --variavel: #f59e0b; --text-muted: #64748b; --input-bg: #ffffff;
        }
        
        /* Cores do Modo Escuro */
        body.dark-mode { 
            --primary: #3b82f6; --bg: #0f172a; --card: #1e293b; 
            --text: #f8fafc; --border: #334155; --fixo: #60a5fa; 
            --variavel: #fbbf24; --text-muted: #94a3b8; --input-bg: #0f172a;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); padding: 10px; display: flex; justify-content: center; margin: 0; transition: background-color 0.3s, color 0.3s; }
        .container { background-color: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 600px; transition: background-color 0.3s; }
        
        /* Cabeçalho e Botão Dark Mode */
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header-top h2 { margin: 0; color: var(--primary); font-size: 20px; }
        .theme-toggle { background: transparent; border: none; font-size: 22px; cursor: pointer; padding: 5px; border-radius: 50%; transition: background 0.3s; }
        .theme-toggle:hover { background: var(--border); }

        .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; color: var(--text-muted); transition: 0.3s; }
        .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); margin-bottom: -2px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); background-color: var(--input-bg); color: var(--text); border-radius: 6px; box-sizing: border-box; font-size: 14px; transition: 0.3s; }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        #campo-parcelas { display: none; }
        button.btn-submit { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button.btn-submit:hover { opacity: 0.9; }
        
        .grafico-container { position: relative; height: 180px; width: 100%; margin-bottom: 20px; }
        
        .mes-container { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 15px; overflow: hidden; background: var(--card); transition: 0.3s; }
        .mes-header { background: var(--primary); color: white; padding: 12px 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.3s; user-select: none; }
        .mes-header.collapsed { background: var(--border); color: var(--text); }
        .mes-title { font-size: 16px; font-weight: bold; }
        .mes-total { font-size: 18px; font-weight: bold; }
        .mes-body { display: block; padding: 0; }
        .mes-body.collapsed { display: none; }
        
        .divider { text-align: center; margin: 30px 0 20px 0; color: var(--text-muted); font-size: 15px; border-bottom: 1px solid var(--border); line-height: 0.1em; }
        .divider span { background: var(--card); padding: 0 15px; transition: 0.3s; }
        
        table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 0; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background-color: var(--bg); color: var(--text-muted); font-weight: 600; }
        .carregando { text-align: center; padding: 20px; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="container">
    <div class="header-top">
        <h2>Controle de Gastos</h2>
        <button id="themeToggle" class="theme-toggle">🌙</button>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="mudarAba('lancamento')">Lançar</div>
        <div class="tab" onclick="mudarAba('dashboard'); carregarDados()">Dashboard</div>
    </div>

    <!-- Aba de Lançamento -->
    <div id="lancamento" class="tab-content active">
        <form id="gastoForm">
            <div class="form-group">
                <label>Data da Compra</label>
                <input type="date" id="dataCompra" required>
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <input type="text" id="descricao" placeholder="Ex: Mercado, Conta de Luz" required>
            </div>
            <div class="form-group">
                <label>Valor Total (R$)</label>
                <input type="number" step="0.01" id="valor" required>
            </div>
            <div class="form-group">
                <label>Tipo</label>
                <select id="tipo" required>
                    <option value="Fixo">Fixo</option>
                    <option value="Variável">Variável</option>
                </select>
            </div>
            <div class="form-group">
                <label>Forma de Pagamento</label>
                <select id="formaPagamento" onchange="verificarParcelas()" required>
                    <option value="Débito / Pix / Dinheiro">Débito / Pix / Dinheiro (Mês Atual)</option>
                    <option value="Cartão de Crédito (1x)">Cartão de Crédito - 1x (Próxima Fatura)</option>
                    <option value="Cartão de Crédito (Parcelado)">Cartão de Crédito - Parcelado</option>
                </select>
            </div>
            <div class="form-group" id="campo-parcelas">
                <label>Número de Parcelas</label>
                <input type="number" id="parcelas" min="2" value="2">
            </div>
            <button type="submit" id="btnSubmit" class="btn-submit">Registrar Gasto</button>
            <div id="status" style="margin-top:15px; text-align:center; font-size:14px;"></div>
        </form>
    </div>

    <!-- Aba de Dashboard -->
    <div id="dashboard" class="tab-content">
        <div class="grafico-container">
            <canvas id="graficoGastos"></canvas>
        </div>
        
        <div id="listaMeses">
            <div class="carregando">Lendo a planilha...</div>
        </div>
    </div>
</div>

<script>
    // Suas URLs
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1cKThLLx3EF3wERPK6i4USCyXDHfrwKboGZnUcn0QGRzZg3AnfUTnZwSz9bhFCbBQ/exec'; 
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0gqmdVYvp5bbtA0xTj7rGVLvnzkfdUZ-bNCjIyX_zgCdjryXlqZ48nvG9wyoosU9Bn_wmS6SZiXCH/pub?gid=51915627&single=true&output=csv'; 

    let todosOsGastos = []; 
    let myChart = null; 

    // LÓGICA DO MODO ESCURO
    const btnTheme = document.getElementById('themeToggle');
    if(localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        btnTheme.innerText = '☀️';
    }

    btnTheme.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        btnTheme.innerText = isDark ? '☀️' : '🌙';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        
        // Recarrega o gráfico para ajustar as cores se estivermos na aba do dashboard
        if(todosOsGastos.length > 0 && document.getElementById('dashboard').classList.contains('active')) {
            renderizarDashboard();
        }
    });

    document.getElementById('dataCompra').valueAsDate = new Date();

    function mudarAba(abaId) {
        document.querySelectorAll('.tab, .tab-content').forEach(el => el.classList.remove('active'));
        document.querySelector(`.tab[onclick*="${abaId}"]`).classList.add('active');
        document.getElementById(abaId).classList.add('active');
    }

    function verificarParcelas() {
        const forma = document.getElementById('formaPagamento').value;
        const isParcelado = forma === 'Cartão de Crédito (Parcelado)';
        document.getElementById('campo-parcelas').style.display = isParcelado ? 'block' : 'none';
        document.getElementById('parcelas').required = isParcelado;
    }

    document.getElementById('gastoForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const status = document.getElementById('status');
        btn.innerText = 'Processando...'; btn.disabled = true; status.innerText = '';
        
        const payload = {
            dataCompra: document.getElementById('dataCompra').value,
            descricao: document.getElementById('descricao').value,
            valor: document.getElementById('valor').value,
            tipo: document.getElementById('tipo').value,
            formaPagamento: document.getElementById('formaPagamento').value,
            parcelas: document.getElementById('formaPagamento').value === 'Cartão de Crédito (Parcelado)' ? document.getElementById('parcelas').value : 1
        };

        fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(data => {
            status.innerText = 'Registrado com sucesso!'; status.style.color = '#22c55e';
            document.getElementById('gastoForm').reset();
            document.getElementById('dataCompra').valueAsDate = new Date();
            verificarParcelas();
        })
        .finally(() => { btn.innerText = 'Registrar Gasto'; btn.disabled = false; });
    });

    function toggleMes(elemento) {
        elemento.classList.toggle('collapsed');
        elemento.nextElementSibling.classList.toggle('collapsed');
    }

    function formatarNomeMes(mesAno) {
        if(!mesAno || !mesAno.includes('/')) return mesAno;
        const [m, a] = mesAno.split('/');
        const nomes = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
        return `${nomes[parseInt(m) - 1]}/${a}`;
    }

    function processarCSV(csvTexto) {
        const linhas = csvTexto.split('\n');
        const resultado = [];
        for (let i = 1; i < linhas.length; i++) { 
            if (linhas[i].trim() === '') continue;
            const valores = linhas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if(valores.length >= 7) {
                resultado.push({
                    dataCompra: valores[0].replace(/['"]/g, '').trim(),
                    mesAnoPagamento: valores[1].replace(/['"]/g, '').trim(),
                    descricao: valores[2].replace(/['"]/g, '').trim(),
                    tipo: valores[3].replace(/['"]/g, '').trim(),
                    formaPagamento: valores[4].replace(/['"]/g, '').trim(),
                    parcela: valores[5].replace(/['"]/g, '').trim(),
                    valor: valores[6].replace(/['"]/g, '').trim()
                });
            }
        }
        return resultado;
    }

    function carregarDados() {
        document.getElementById('listaMeses').innerHTML = '<div class="carregando">Lendo a planilha...</div>';
        fetch(CSV_URL + "&t=" + new Date().getTime())
        .then(res => res.text())
        .then(csvTexto => {
            todosOsGastos = processarCSV(csvTexto);
            renderizarDashboard();
        });
    }

    function criarElementoMes(mesStr, isExpanded) {
        const gastosDoMes = todosOsGastos.filter(g => g.mesAnoPagamento === mesStr);
        let totalMes = 0; let totalFixo = 0; let totalVar = 0;
        let linhasTabela = '';

        gastosDoMes.forEach(g => {
            const valor = parseFloat(g.valor.replace('R$', '').trim().replace('.', '').replace(',', '.')) || 0;
            totalMes += valor;
            if(g.tipo === 'Fixo') totalFixo += valor; else totalVar += valor;
            
            const corPonto = g.tipo === 'Fixo' ? 'var(--fixo)' : 'var(--variavel)';
            
            linhasTabela += `
                <tr>
                    <td><small>${g.dataCompra.slice(0,5)}</small></td>
                    <td>
                        <span style="color:${corPonto}; font-size:10px;">⬤</span> ${g.descricao} <br>
                        <small style="color:var(--text-muted)">${g.formaPagamento} (Parc. ${g.parcela})</small>
                    </td>
                    <td>R$ ${valor.toFixed(2).replace('.', ',')}</td>
                </tr>
            `;
        });

        const collapsedClass = isExpanded ? '' : 'collapsed';
        
        const mesDiv = document.createElement('div');
        mesDiv.className = 'mes-container';
        mesDiv.innerHTML = `
            <div class="mes-header ${collapsedClass}" onclick="toggleMes(this)">
                <div style="display:flex; flex-direction:column;">
                    <span class="mes-title">${formatarNomeMes(mesStr)}</span>
                    <small style="font-size:11px; font-weight:normal; margin-top:2px;">
                        <span style="color:${isExpanded ? '#bae6fd' : 'var(--fixo)'};">Fixo: R$ ${totalFixo.toFixed(2)}</span> | 
                        <span style="color:${isExpanded ? '#fde68a' : 'var(--variavel)'};">Var: R$ ${totalVar.toFixed(2)}</span>
                    </small>
                </div>
                <span class="mes-total">R$ ${totalMes.toFixed(2).replace('.', ',')}</span>
            </div>
            <div class="mes-body ${collapsedClass}">
                <table><tbody>${linhasTabela}</tbody></table>
            </div>
        `;
        return mesDiv;
    }

    function atualizarGrafico(mesesFuturos) {
        const isDark = document.body.classList.contains('dark-mode');
        const corTexto = isDark ? '#cbd5e1' : '#475569';
        const corGrade = isDark ? '#334155' : '#e2e8f0';

        const mesesGrafico = mesesFuturos.slice(0, 6).reverse(); 
        
        const labels = mesesGrafico.map(m => formatarNomeMes(m.str).split('/')[0]);
        const dadosGrafico = mesesGrafico.map(m => {
            const gastos = todosOsGastos.filter(g => g.mesAnoPagamento === m.str);
            return gastos.reduce((acc, curr) => acc + (parseFloat(curr.valor.replace('.', '').replace(',', '.')) || 0), 0);
        });

        const ctx = document.getElementById('graficoGastos').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Gastos Previstos (R$)', data: dadosGrafico,
                    backgroundColor: '#3b82f6', borderRadius: 4
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { 
                    x: { ticks: { color: corTexto }, grid: { color: corGrade } },
                    y: { beginAtZero: true, ticks: { color: corTexto }, grid: { color: corGrade } } 
                }
            }
        });
    }

    function renderizarDashboard() {
        const listaMeses = document.getElementById('listaMeses');
        listaMeses.innerHTML = ''; 

        if(todosOsGastos.length === 0) return;

        const mesesSet = new Set(todosOsGastos.map(g => g.mesAnoPagamento));
        const mesesMapeados = Array.from(mesesSet).filter(m => m.includes('/'))
            .map(m => {
                const [mes, ano] = m.split('/');
                return { str: m, peso: parseInt(ano) * 12 + parseInt(mes) };
            });

        const hoje = new Date();
        const pesoAtual = hoje.getFullYear() * 12 + (hoje.getMonth() + 1);

        const mesesFuturos = mesesMapeados.filter(m => m.peso >= pesoAtual).sort((a, b) => a.peso - b.peso);
        const mesesPassados = mesesMapeados.filter(m => m.peso < pesoAtual).sort((a, b) => b.peso - a.peso);

        let mesParaExpandir = mesesFuturos.length > 0 ? (mesesFuturos.some(m => m.peso === pesoAtual) ? pesoAtual : mesesFuturos[0].peso) : null;

        atualizarGrafico(mesesFuturos.length > 0 ? mesesFuturos : mesesPassados.slice(0, 6));

        mesesFuturos.forEach(m => listaMeses.appendChild(criarElementoMes(m.str, (m.peso === mesParaExpandir))));

        if (mesesPassados.length > 0) {
            const divider = document.createElement('div');
            divider.className = 'divider'; divider.innerHTML = '<span>Meses Anteriores</span>';
            listaMeses.appendChild(divider);
            mesesPassados.forEach(m => listaMeses.appendChild(criarElementoMes(m.str, false)));
        }
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Falhou: ', err));
        });
    }
</script>

</body>
</html>
